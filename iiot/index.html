<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Motor AR Dashboard</title>
    <!-- A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- Beautiful UI Overlay -->
    <div id="ui-overlay">
        <div class="header">
            <h1>AR Dashboard</h1>
            <p id="status-text">Scanning for Motor Marker...</p>
        </div>
        <div class="scan-animation">
            <div class="scan-line"></div>
        </div>
    </div>

    <!-- Persistent AR Controls -->
    <button style="pointer-events: auto; position:absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(30, 33, 48, 0.85); color: white; border: 2px solid #00D2FF; padding: 15px 30px; border-radius: 30px; font-size: 16px; font-weight:bold; cursor:pointer; box-shadow: 0 0 15px rgba(0,210,255,0.4);" onclick="toggleMotorAR()">Toggle Motor</button>

    <!-- AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; colorManagement: true;">
        <a-assets>
            <canvas id="data-canvas" width="1000" height="600"></canvas>
        </a-assets>
        <a-marker preset="hiro" id="motor-marker">
            <!-- 3D UI Panel background mapped to robust Canvas element -->
            <a-entity position="0 0.5 0" rotation="-90 0 0">
                <a-plane id="data-plane" position="0 0 0" width="2.5" height="1.5" material="src: #data-canvas; shader: flat; transparent: true"></a-plane>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script src="main.js"></script>
</body>
</html>
